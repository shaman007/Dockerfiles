name: Docker Multi

on:
  schedule:
    - cron: '29 2 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push, and sign each Dockerfile
        env:
          REGISTRY: ${{ env.REGISTRY }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r dockerfile; do
            dir="$(dirname "$dockerfile")"
            name="$(basename "$dir")"
            image="${REGISTRY}/shaman007/${name}"
            tags=("${image}:latest")

            if [[ "$name" == "mastodon" ]]; then
              mastodon_version="$(sed -n 's|^FROM ghcr.io/mastodon/mastodon:\([^[:space:]]*\)$|\1|p' "$dockerfile")"
              [[ -n "$mastodon_version" ]] || {
                echo "Could not determine the Mastodon version from $dockerfile" >&2
                exit 1
              }
              tags+=("${image}:${mastodon_version}")
            fi

            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done

            push_args=()
            if [[ "$PUSH" == "true" ]]; then
              push_args+=(--push)
            fi

            echo "Building ${tags[*]} from ${dir}"
            docker buildx build "$dir" \
              --platform linux/amd64,linux/arm64 \
              "${tag_args[@]}" \
              --provenance=false \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              "${push_args[@]}"

            if [[ "$PUSH" == "true" ]]; then
              digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
              ref="${image}@${digest}"
              echo "Signing ${ref}"
              cosign sign --yes "$ref"
            fi
          done < <(find . -mindepth 2 -maxdepth 2 -name Dockerfile -print | sort)
