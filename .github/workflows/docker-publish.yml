name: Docker Multi

on:
  schedule:
    - cron: '29 2 * * *'
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test signing contract without building images
        run: python3 -m unittest discover -s tests -p test_build_signing.py -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Build and push each Dockerfile
        env:
          REGISTRY: ${{ env.REGISTRY }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -Eeuo pipefail

          while IFS= read -r dockerfile; do
            dir="$(dirname "$dockerfile")"
            name="$(basename "$dir")"

            if [[ -f "$dir/.skip-ghcr-publish" ]]; then
              echo "Skipping ${name}: published by its source repository"
              continue
            fi

            image="${REGISTRY}/shaman007/${name}"
            tags=("${image}:latest")

            if [[ "$name" == "mastodon" ]]; then
              mastodon_image_tag="$(sed -n 's|^# mastodon-image-tag: \([^[:space:]]*\)$|\1|p' "$dockerfile")"
              [[ -n "$mastodon_image_tag" ]] || {
                echo "Could not determine the custom Mastodon image tag from $dockerfile" >&2
                exit 1
              }
              tags+=("${image}:${mastodon_image_tag}")
            fi

            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(--tag "$tag")
            done

            push_args=()
            if [[ "$PUSH" == "true" ]]; then
              push_args+=(--push)
            fi

            platforms="linux/amd64,linux/arm64"
            if [[ -f "$dir/platforms" ]]; then
              IFS= read -r platforms < "$dir/platforms"
              [[ -n "$platforms" ]] || {
                echo "$dir/platforms is empty" >&2
                exit 1
              }
            fi

            echo "Building ${tags[*]} from ${dir} for ${platforms}"
            metadata="$(mktemp)"
            docker buildx build "$dir" \
              --platform "$platforms" \
              "${tag_args[@]}" \
              --metadata-file "$metadata" \
              --provenance=false \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              "${push_args[@]}"
            if [[ "$PUSH" == "true" ]]; then
              digest="$(jq -er '. ["containerimage.digest"]' "$metadata")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
              cosign sign --yes "$image@$digest"
              cosign verify \
                --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$image@$digest"
            fi
            rm -f "$metadata"
          done < <(find . -mindepth 2 -maxdepth 2 -name Dockerfile -print | sort)
